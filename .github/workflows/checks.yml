name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - name: Core round trip (sample model)
        run: node app/test/roundtrip.js demo/benchy_8t.3mf
      - name: Build page
        run: python3 app/build.py
      - name: Vet, test and build the Windows program
        working-directory: desktop
        run: |
          go vet ./...
          go test ./...
          GOOS=windows GOARCH=amd64 go vet ./...
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -o /dev/null .
